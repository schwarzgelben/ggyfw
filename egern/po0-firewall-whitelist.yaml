name: GGY 咕咕云防火墙自动加白
description: 调用咕咕云 (GGY) 防火墙白名单链接将出口 IP 自动加入安全组，并展示实时流量。支持固定槽位 (@0~@4)、环形轮流写入、手机识别 /24 放行、网络切换自动加白与面板手动刷新。
author: reallinzc
homepage: https://github.com/schwarzgelben/ggyfw

compat_arguments:
  tokens: ""
  skip_wifi: ""
  ua: "mobile"
  slot: ""

rules:
  - domain:
      match: www.guguyun.com
      policy: DIRECT

scriptings:
  - schedule:
      name: ggy-fw-cron
      cron: "*/10 * * * *"
      script_url: https://raw.githubusercontent.com/schwarzgelben/ggyfw/main/egern/po0-firewall-whitelist.js?v=20261111b
      timeout: 60
      env:
        tokens: "{{{tokens}}}"
        skip_wifi: "{{{skip_wifi}}}"
        ua: "{{{ua}}}"
        slot: "{{{slot}}}"
  - network:
      name: ggy-fw-network
      script_url: https://raw.githubusercontent.com/schwarzgelben/ggyfw/main/egern/po0-firewall-whitelist.js?v=20261111b
      timeout: 60
      env:
        tokens: "{{{tokens}}}"
        skip_wifi: "{{{skip_wifi}}}"
        ua: "{{{ua}}}"
        slot: "{{{slot}}}"
